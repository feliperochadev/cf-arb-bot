# ============================================================
# cf-arb-bot — configuration (cf-arb-bot-plan.md §5.6)
# Every parameter is overridable via env var, e.g. CF_BOT_DRY_RUN=false CF_BOT_STRATEGY_MIN_NET_BPS=8
# ============================================================
quarkus.application.name=cf-arb-bot
quarkus.http.port=8080
quarkus.banner.enabled=false

# --- Safety --------------------------------------------------
# S4: paper trading by default. NEVER flip this default in code — see CLAUDE.md and BotService's
# startup warning. Live requires an explicit CF_BOT_DRY_RUN=false env override.
cf-bot.dry-run=true

# --- Venue -----------------------------------------------------
cf-bot.venue.ws-url=wss://wbs-api.mexc.com/ws
cf-bot.venue.rest-url=https://api.mexc.com
# Gate 0 step 4 (probed live 2026-09-07): aggre.depth@10ms is the clear winner. limit.depth@20 —
# the plan's original guess at a fast snapshot channel — measured at a 500ms cadence, SLOWER than
# even aggre.depth@100ms; aggre.depth@10ms delivers real per-symbol intervals of 14-41ms, well
# under the ~200ms median opportunity window. See cf-arb-bot-plan.md §3 step 4 / §5.2.
cf-bot.venue.depth-channel=aggre.depth@10ms

# --- Universe --------------------------------------------------
# Exactly the 9 symbols that appear in a triangle confirmed executable at $100 after real lot-size
# quantization (cf-arb-bot-plan.md §2.1, re-verified live against exchangeInfo 2026-09-07). SOLBTC,
# SOLUSDC, SOLUSDT, ETHBTC are deliberately excluded — their triangles are dead or blocked at this
# seed size (SOLBTC's minimum order is 1 whole SOL; SOLUSDC/ETHBTC's lot-size rounding drag is
# 115/250 bps). They remain available in recorder-service's own subscription set for a larger seed.
cf-bot.symbols=BTCUSDT,BTCUSDC,ETHUSDT,ETHUSDC,XRPUSDT,XRPUSDC,XRPBTC,XRPETH,USDCUSDT

# --- Triangles ---------------------------------------------------
# Five executable pairs (forward + reverse = 10 configured triangles), all USDT/USDC-anchored,
# all confirmed tradeable at a $100 seed by cf-arb-bot-plan.md §2.1's live exchangeInfo check.
# Leg format: SYMBOL:SIDE where SIDE is BID (sell base into the bid) or ASK (buy base off the ask) —
# matches cfarb.stage2_cycles.TradeLeg.side exactly, so EdgeCalculator is directly comparable to the
# Python research pipeline (verification item 3).

# USDT -> BTC -> XRP -> USDT  (10.0bps taker, 2.9bps quantization drag)
cf-bot.triangles.usdt-btc-xrp-fwd.legs=BTCUSDT:ASK,XRPBTC:ASK,XRPUSDT:BID
cf-bot.triangles.usdt-btc-xrp-fwd.enabled=true
cf-bot.triangles.usdt-btc-xrp-rev.legs=XRPUSDT:ASK,XRPBTC:BID,BTCUSDT:BID
cf-bot.triangles.usdt-btc-xrp-rev.enabled=true

# USDT -> USDC -> XRP -> USDT  (0.0bps taker LIVE — confirmed zero-fee, cf-arb-bot-plan.md §2.2 —
# 3.8bps quantization drag)
cf-bot.triangles.usdt-usdc-xrp-fwd.legs=USDCUSDT:ASK,XRPUSDC:ASK,XRPUSDT:BID
cf-bot.triangles.usdt-usdc-xrp-fwd.enabled=true
cf-bot.triangles.usdt-usdc-xrp-rev.legs=XRPUSDT:ASK,XRPUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-usdc-xrp-rev.enabled=true

# USDT -> ETH -> XRP -> USDT  (10.0bps taker, 5.3bps quantization drag)
cf-bot.triangles.usdt-eth-xrp-fwd.legs=ETHUSDT:ASK,XRPETH:ASK,XRPUSDT:BID
cf-bot.triangles.usdt-eth-xrp-fwd.enabled=true
cf-bot.triangles.usdt-eth-xrp-rev.legs=XRPUSDT:ASK,XRPETH:BID,ETHUSDT:BID
cf-bot.triangles.usdt-eth-xrp-rev.enabled=true

# USDT -> ETH -> USDC -> USDT  (5.0bps taker, 5.9bps quantization drag)
cf-bot.triangles.usdt-eth-usdc-fwd.legs=ETHUSDT:ASK,ETHUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-eth-usdc-fwd.enabled=true
cf-bot.triangles.usdt-eth-usdc-rev.legs=USDCUSDT:ASK,ETHUSDC:ASK,ETHUSDT:BID
cf-bot.triangles.usdt-eth-usdc-rev.enabled=true

# USDT -> BTC -> USDC -> USDT  (5.0bps taker, 9.0bps quantization drag)
cf-bot.triangles.usdt-btc-usdc-fwd.legs=BTCUSDT:ASK,BTCUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-btc-usdc-fwd.enabled=true
cf-bot.triangles.usdt-btc-usdc-rev.legs=USDCUSDT:ASK,BTCUSDC:ASK,BTCUSDT:BID
cf-bot.triangles.usdt-btc-usdc-rev.enabled=true

# --- Strategy ----------------------------------------------------
# 10bps costs ~60-70% of PnL vs 5bps; 20bps yields ~2 trades/day (cf-arb-poc analysis).
cf-bot.strategy.min-net-bps=5.0
cf-bot.strategy.slippage-buffer-bps=1.0
cf-bot.strategy.max-book-age-ms=250

# --- Capital -------------------------------------------------------
cf-bot.capital.seed-usd=100.0
cf-bot.capital.anchor-asset=USDT
cf-bot.capital.compound=true

# --- Risk (S5 fail-closed, S6 hard-clamped in code too) -------------
cf-bot.risk.equity-floor-usd=50.0
cf-bot.risk.max-notional-usd=200.0
cf-bot.risk.max-open-cycles=1
# Retuned from cf-trader's 30/min (cf-arb-bot-plan.md §5.5): kept as a hard cap per S6 rather than
# deleted per cf-trader-path-to-profitable.md §5.3's argument, since the observed fill rate here
# (5-15/hour at 5bps) is nowhere near binding — this is a product decision under rule Q9, not a
# silently-changed safety default.
cf-bot.risk.max-cycles-per-minute=30
cf-bot.risk.cycle-cooldown-ms=250
cf-bot.risk.max-consecutive-failures=3

# --- Execution --------------------------------------------------
# IMMEDIATE_OR_CANCEL is MEXC's real order-type enum value (there is no separate timeInForce param) --
# but NONE of the 9 symbols below currently advertise support for it per GET /api/v3/exchangeInfo
# (only LIMIT/MARKET/LIMIT_MAKER). Startup validation fails closed on this in live mode until the
# venue enables it here or the execution design changes -- cf-arb-bot-review-plan.md Tier 1 step 1.3.
cf-bot.exec.order-type=IMMEDIATE_OR_CANCEL
cf-bot.exec.recv-window-ms=5000
cf-bot.exec.leg-timeout-ms=1500

# --- Journal ------------------------------------------------------
cf-bot.journal.dir=./journal

# --- Observability ------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true
quarkus.log.category."io.cfarb".level=INFO

# --- Dev profile: chattier logs -----------------------------------
%dev.quarkus.log.category."io.cfarb".level=DEBUG

# --- Tokyo production profile (cf-arb-bot-plan.md §7) --------------
# Loopback by default; the Tokyo systemd unit's security group is egress-only + admin-CIDR-only
# ingress on 443 (defense in depth, same posture as recorder-service's %prod note).
%prod.quarkus.http.host=127.0.0.1
