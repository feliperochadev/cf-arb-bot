# ============================================================
# cf-arb-bot — configuration (cf-arb-bot-plan.md §5.6)
# Every parameter is overridable via env var, e.g. CF_BOT_DRY_RUN=false CF_BOT_STRATEGY_MIN_NET_BPS=8
# ============================================================
quarkus.application.name=cf-arb-bot
quarkus.http.port=8080
quarkus.banner.enabled=false

# --- Safety --------------------------------------------------
# S4: paper trading by default. NEVER flip this default in code — see CLAUDE.md and BotService's
# startup warning. Live requires an explicit CF_BOT_DRY_RUN=false env override.
cf-bot.dry-run=true

# --- Venue -----------------------------------------------------
cf-bot.venue.ws-url=wss://wbs-api.mexc.com/ws
cf-bot.venue.rest-url=https://api.mexc.com
# Gate 0 step 4 (probed live 2026-09-07): aggre.depth@10ms is the clear winner. limit.depth@20 —
# the plan's original guess at a fast snapshot channel — measured at a 500ms cadence, SLOWER than
# even aggre.depth@100ms; aggre.depth@10ms delivers real per-symbol intervals of 14-41ms, well
# under the ~200ms median opportunity window. See cf-arb-bot-plan.md §3 step 4 / §5.2.
cf-bot.venue.depth-channel=aggre.depth@10ms

# --- Universe --------------------------------------------------
# The 9 symbols confirmed executable at a $100 seed after real lot-size quantization
# (cf-arb-bot-plan.md §2.1, re-verified live against exchangeInfo 2026-09-07), PLUS SOLUSDT/SOLBTC/
# ETHBTC (added 2026-09-10). SOL* and ETHBTC were previously excluded because SOLBTC's minimum order
# is 1 whole SOL (~$150-220) and SOLUSDC/ETHBTC carry 115/250 bps of lot-size rounding drag at $100
# — all a function of a $100 seed. cf-arb-poc's own triangular results put every profitable MEXC
# cycle in this family (BTCUSDT->SOLUSDT->SOLBTC +11.4%/139h, BTCUSDT->ETHUSDT->ETHBTC +1.9%; the
# 10 USDT/USDC/XRP triangles below were the *marginal* ones), so at the larger seed sizes now in
# use they are back in. recorder-service already subscribes to all of these. SOLUSDC is still out:
# it only enables purely USDC-anchored cycles, which need cf-bot.capital.anchor-asset work first.
#
# EXPANDED 2026-09-10 (MEXC-SYMBOL-EXPANSION-TASK.md, from MEXC-PAIR-EXPANSION.md research): 12 -> 30
# symbols, filling the single-connection WebSocket budget (MexcProtocol.MAX_STREAMS_PER_CONNECTION).
# Group A/B (USD1*, GOLD(XAUT)*, SOLUSDC, TAO*) wire 5 new USDT-anchored currency loops (10 triangle
# entries below); Group C (PUMPUSDT..TRXUSDT) are feed/observation only -- the deepest unused X/USDT
# books, no liquid non-USDT cross, referenced by NO triangle so never traded even in live mode. The
# point is dry-run journal coverage (opportunity/gross_bps): MEXC-PAIR-EXPANSION.md §3 finds no new
# closable edge exists on this venue; this expansion is how we confirm that empirically. dry-run,
# risk caps, order-type and capital are all UNCHANGED -- universe change only.
cf-bot.symbols=BTCUSDT,BTCUSDC,ETHUSDT,ETHUSDC,XRPUSDT,XRPUSDC,XRPBTC,XRPETH,USDCUSDT,SOLUSDT,SOLBTC,ETHBTC,USD1USDT,USD1USDC,GOLD(XAUT)USDT,GOLD(XAUT)USD1,GOLD(XAUT)USDC,SOLUSDC,TAOUSDT,TAOUSDC,PUMPUSDT,ENAUSDT,BNBUSDT,DGAIUSDT,DOGEUSDT,LITUSDT,ETHFIUSDT,BCHUSDT,ADAUSDT,TRXUSDT

# --- Triangles ---------------------------------------------------
# Twelve currency loops (forward + reverse = 24 configured triangles), all USDT-anchored. The last
# five (usdt-usdc-usd1, usdt-usd1-xaut, usdt-usdc-xaut, usdt-usdc-sol, usdt-usdc-tao) were added
# 2026-09-10 by MEXC-SYMBOL-EXPANSION-TASK.md and ship ENABLED for dry-run observation only --
# MEXC-PAIR-EXPANSION.md §4c: expected value is low, this is an "does any edge close" exercise, not
# a profitability claim.
# Leg format: SYMBOL:SIDE where SIDE is BID (sell base into the bid) or ASK (buy base off the ask) —
# matches cfarb.stage2_cycles.TradeLeg.side exactly, so EdgeCalculator is directly comparable to the
# Python research pipeline (verification item 3).

# USDT -> BTC -> XRP -> USDT  (10.0bps taker, 2.9bps quantization drag)
cf-bot.triangles.usdt-btc-xrp-fwd.legs=BTCUSDT:ASK,XRPBTC:ASK,XRPUSDT:BID
cf-bot.triangles.usdt-btc-xrp-fwd.enabled=true
cf-bot.triangles.usdt-btc-xrp-rev.legs=XRPUSDT:ASK,XRPBTC:BID,BTCUSDT:BID
cf-bot.triangles.usdt-btc-xrp-rev.enabled=true

# USDT -> USDC -> XRP -> USDT  (0.0bps taker LIVE — confirmed zero-fee, cf-arb-bot-plan.md §2.2 —
# 3.8bps quantization drag)
cf-bot.triangles.usdt-usdc-xrp-fwd.legs=USDCUSDT:ASK,XRPUSDC:ASK,XRPUSDT:BID
cf-bot.triangles.usdt-usdc-xrp-fwd.enabled=true
cf-bot.triangles.usdt-usdc-xrp-rev.legs=XRPUSDT:ASK,XRPUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-usdc-xrp-rev.enabled=true

# USDT -> ETH -> XRP -> USDT  (10.0bps taker, 5.3bps quantization drag)
cf-bot.triangles.usdt-eth-xrp-fwd.legs=ETHUSDT:ASK,XRPETH:ASK,XRPUSDT:BID
cf-bot.triangles.usdt-eth-xrp-fwd.enabled=true
cf-bot.triangles.usdt-eth-xrp-rev.legs=XRPUSDT:ASK,XRPETH:BID,ETHUSDT:BID
cf-bot.triangles.usdt-eth-xrp-rev.enabled=true

# USDT -> ETH -> USDC -> USDT  (5.0bps taker, 5.9bps quantization drag)
cf-bot.triangles.usdt-eth-usdc-fwd.legs=ETHUSDT:ASK,ETHUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-eth-usdc-fwd.enabled=true
cf-bot.triangles.usdt-eth-usdc-rev.legs=USDCUSDT:ASK,ETHUSDC:ASK,ETHUSDT:BID
cf-bot.triangles.usdt-eth-usdc-rev.enabled=true

# USDT -> BTC -> USDC -> USDT  (5.0bps taker, 9.0bps quantization drag)
cf-bot.triangles.usdt-btc-usdc-fwd.legs=BTCUSDT:ASK,BTCUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-btc-usdc-fwd.enabled=true
cf-bot.triangles.usdt-btc-usdc-rev.legs=USDCUSDT:ASK,BTCUSDC:ASK,BTCUSDT:BID
cf-bot.triangles.usdt-btc-usdc-rev.enabled=true

# USDT -> SOL -> BTC -> USDT  (15.0bps taker: SOLUSDT 5 + SOLBTC 5 + BTCUSDT 5). cf-arb-poc's #1
# triangular cycle by realized PnL (mexc:BTCUSDT:bid->SOLUSDT:ask->SOLBTC:bid, +11.4%/139h, 132
# actionable fills, mean +8.3 booked bps) — high per-cycle cost, but it fired often enough in the
# Aug capture to dominate. Needs a seed clearing SOLBTC's 1-whole-SOL minimum (~$150-220).
cf-bot.triangles.usdt-sol-btc-fwd.legs=SOLUSDT:ASK,SOLBTC:BID,BTCUSDT:BID
cf-bot.triangles.usdt-sol-btc-fwd.enabled=true
cf-bot.triangles.usdt-sol-btc-rev.legs=BTCUSDT:ASK,SOLBTC:ASK,SOLUSDT:BID
cf-bot.triangles.usdt-sol-btc-rev.enabled=true

# USDT -> ETH -> BTC -> USDT  (15.0bps taker: ETHUSDT 5 + ETHBTC 5 + BTCUSDT 5). cf-arb-poc's #4
# cycle (mexc:BTCUSDT:bid->ETHUSDT:ask->ETHBTC:bid, +1.9%/139h, 28 actionable, mean +6.6 booked bps).
cf-bot.triangles.usdt-eth-btc-fwd.legs=ETHUSDT:ASK,ETHBTC:BID,BTCUSDT:BID
cf-bot.triangles.usdt-eth-btc-fwd.enabled=true
cf-bot.triangles.usdt-eth-btc-rev.legs=BTCUSDT:ASK,ETHBTC:ASK,ETHUSDT:BID
cf-bot.triangles.usdt-eth-btc-rev.enabled=true

# ===== Added 2026-09-10 — MEXC-SYMBOL-EXPANSION-TASK.md (dry-run observation only) =====

# USDT -> USDC -> USD1 -> USDT  (0.0 bps taker: USDCUSDT 0 + USD1USDC 0 + USD1USDT 0).
# Pure stablecoin loop, all legs zero-fee and sub-2bps spread. Edges are tiny/rare (all three
# assets peg to 1.0) but cost is ~zero. USD1 = World Liberty Financial USD1. USD1USDC is thin (~$0.18M/24h).
cf-bot.triangles.usdt-usdc-usd1-fwd.legs=USDCUSDT:ASK,USD1USDC:ASK,USD1USDT:BID
cf-bot.triangles.usdt-usdc-usd1-fwd.enabled=true
cf-bot.triangles.usdt-usdc-usd1-rev.legs=USD1USDT:ASK,USD1USDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-usdc-usd1-rev.enabled=true

# USDT -> USD1 -> GOLD(XAUT) -> USDT  (6.0 bps taker: USD1USDT 0 + GOLD(XAUT)USD1 1 + GOLD(XAUT)USDT 5).
# Best-liquidity new loop: every leg sub-2bps spread with real depth (~$170k/$68k on the cross).
# Tokenised gold (XAUT) genuinely dislocates vs USDT in volatile sessions.
cf-bot.triangles.usdt-usd1-xaut-fwd.legs=USD1USDT:ASK,GOLD(XAUT)USD1:ASK,GOLD(XAUT)USDT:BID
cf-bot.triangles.usdt-usd1-xaut-fwd.enabled=true
cf-bot.triangles.usdt-usd1-xaut-rev.legs=GOLD(XAUT)USDT:ASK,GOLD(XAUT)USD1:BID,USD1USDT:BID
cf-bot.triangles.usdt-usd1-xaut-rev.enabled=true

# USDT -> USDC -> GOLD(XAUT) -> USDT  (5.0 bps taker: USDCUSDT 0 + GOLD(XAUT)USDC 0 + GOLD(XAUT)USDT 5).
# Alt route to the gold triangle, 1 bps cheaper than via USD1 but GOLD(XAUT)USDC is much thinner
# (~$0.08M/24h). Keep both; EdgeCalculator picks whichever actually fills.
cf-bot.triangles.usdt-usdc-xaut-fwd.legs=USDCUSDT:ASK,GOLD(XAUT)USDC:ASK,GOLD(XAUT)USDT:BID
cf-bot.triangles.usdt-usdc-xaut-fwd.enabled=true
cf-bot.triangles.usdt-usdc-xaut-rev.legs=GOLD(XAUT)USDT:ASK,GOLD(XAUT)USDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-usdc-xaut-rev.enabled=true

# USDT -> USDC -> SOL -> USDT  (5.0 bps taker: USDCUSDT 0 + SOLUSDC 0 + SOLUSDT 5).
# SOLUSDT already subscribed. NOTE: SOLUSDC advertises NO MARKET order type -- exec.Unwinder's
# MARKET fallback already checks per-symbol order_types (Unwinder.java:198) and strands+trips rather
# than submitting a doomed limit, same as ETHUSDC/XRPUSDC. SOLUSDC book is one-sided (deep bid, thin
# ask) -- watch the fwd direction.
cf-bot.triangles.usdt-usdc-sol-fwd.legs=USDCUSDT:ASK,SOLUSDC:ASK,SOLUSDT:BID
cf-bot.triangles.usdt-usdc-sol-fwd.enabled=true
cf-bot.triangles.usdt-usdc-sol-rev.legs=SOLUSDT:ASK,SOLUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-usdc-sol-rev.enabled=true

# USDT -> USDC -> TAO -> USDT  (5.0 bps taker: USDCUSDT 0 + TAOUSDC 0 + TAOUSDT 5).
# TAOUSDC top-of-book depth is very small (~$10-120); most cycles will quantize to dust and be
# refused by Sizer. Included for journal coverage.
cf-bot.triangles.usdt-usdc-tao-fwd.legs=USDCUSDT:ASK,TAOUSDC:ASK,TAOUSDT:BID
cf-bot.triangles.usdt-usdc-tao-fwd.enabled=true
cf-bot.triangles.usdt-usdc-tao-rev.legs=TAOUSDT:ASK,TAOUSDC:BID,USDCUSDT:BID
cf-bot.triangles.usdt-usdc-tao-rev.enabled=true

# --- Strategy ----------------------------------------------------
# 10bps costs ~60-70% of PnL vs 5bps; 20bps yields ~2 trades/day (cf-arb-poc analysis).
cf-bot.strategy.min-net-bps=5.0
cf-bot.strategy.slippage-buffer-bps=1.0
cf-bot.strategy.max-book-age-ms=250

# --- Capital -------------------------------------------------------
cf-bot.capital.seed-usd=10000.0
cf-bot.capital.anchor-asset=USDT
cf-bot.capital.compound=true

# --- Risk (S5 fail-closed) -----------------------------------------
cf-bot.risk.equity-floor-usd=8000.0
# The one per-cycle notional cap. RiskGates logs an ERROR and REFUSES TO START if this is <= 0
# (S6: a misconfigured cap is loud and fatal, never silently defaulted or clamped). Otherwise
# trusted as configured; at runtime each cycle is also bounded by min(equity, cap) and the kill
# switch. Was additionally code-clamped to a frozen RiskGates.ABSOLUTE_MAX_NOTIONAL_USD=1000.0
# until 2026-09-10 — which silently strangled every cycle to $1k once the seed moved to 4-5 figures.
cf-bot.risk.max-notional-usd=20000.0
cf-bot.risk.max-open-cycles=10
# Retuned from cf-trader's 30/min (cf-arb-bot-plan.md §5.5): kept as a hard cap per S6 rather than
# deleted per cf-trader-path-to-profitable.md §5.3's argument, since the observed fill rate here
# (5-15/hour at 5bps) is nowhere near binding — this is a product decision under rule Q9, not a
# silently-changed safety default.
cf-bot.risk.max-cycles-per-minute=300
cf-bot.risk.cycle-cooldown-ms=250
cf-bot.risk.max-consecutive-failures=3

# --- Execution --------------------------------------------------
# IOC is MEXC's real order-type enum value for this bot's use case (LIMIT/MARKET/LIMIT_MAKER/IOC/FOK
# is the documented type ENUM; there is no separate timeInForce request parameter on
# POST /api/v3/order at all). exchangeInfo's per-symbol order_types never lists IOC/FOK for ANY MEXC
# symbol, so startup validation treats this specific combination as unverified-but-permitted (a loud
# WARN), not fail-closed -- the credentialed 1-USDT probe is the real gate before dry-run=false. See
# BotConfig.ExecConfig#orderType's javadoc for the full correction history.
cf-bot.exec.order-type=IOC
cf-bot.exec.recv-window-ms=5000
cf-bot.exec.leg-timeout-ms=1500
# Basis-point buffer exec.Unwinder crosses the current top of book by when reversing a held asset --
# clamped per-symbol inside PERCENT_PRICE_BY_SIDE before submission (see ExecConfig#unwindCrossBps).
cf-bot.exec.unwind-cross-bps=40
# An OrderIntent older than this when finally dequeued is dropped rather than executed (see
# ExecConfig#maxIntentAgeMs).
cf-bot.exec.max-intent-age-ms=150

# --- Journal ------------------------------------------------------
cf-bot.journal.dir=./journal
# Minimum gap between two journaled REJECT events for the same triangle. Unsampled, this stream runs
# at feed rate (~900 lines/s, ~10 GB/day, enough to fill the deployed 20GB root volume in ~2 days of
# DRY-RUN) because every candidate past the cheap risk gates lands on a reject path. Fires and
# order-queue-full events are never sampled; suppressed rejects are counted as
# cfarb.journal.suppressed. See BotConfig.JournalConfig#rejectSampleMs.
cf-bot.journal.reject-sample-ms=1000

# --- Observability ------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true
quarkus.log.category."io.cfarb".level=INFO

# --- Dry-run console visibility (opt-in, all off the hot path) -----
# A rolling activity summary + per-event echo to the console, for watching a local dry-run run.
# The NDJSON journal (./journal/) and Prometheus (/q/metrics) stay the real telemetry. Enable with
# CF_BOT_OBSERVABILITY_CONSOLE_REPORT=true CF_BOT_OBSERVABILITY_ECHO_EVENTS=true, or run quarkus:dev
# (the %dev profile below turns both on). See BotConfig.ObservabilityConfig.
cf-bot.observability.console-report=false
cf-bot.observability.console-report-interval-ms=60000
cf-bot.observability.echo-events=false

# --- Dev profile: chattier logs -----------------------------------
%dev.quarkus.log.category."io.cfarb".level=DEBUG
%dev.cf-bot.observability.console-report=true
%dev.cf-bot.observability.echo-events=true

# --- Tokyo production profile (cf-arb-bot-plan.md §7) --------------
# Loopback by default; the Tokyo systemd unit's security group is egress-only + admin-CIDR-only
# ingress on 443 (defense in depth, same posture as recorder-service's %prod note).
%prod.quarkus.http.host=127.0.0.1
